<style>

<script>
const $ = id => document.getElementById(id)
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const ic = (n, s = 18, c = '') => `<svg class="ic ${c}" width="${s}" height="${s}"><use href="#i-${n}"/></svg>`

function inl(s) {
  const codes = []
  const link = (href, label) => `<a>${/github\.com/.test(href) ? ic('gh', 16, 'fl ghi') : ''}${label}</a>`
  return esc(s.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`))
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, l, h) => link(h, l))
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, (_, p, h) => p + link(h, h))
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/(^|\W)_([^_]+)_(?=\W|$)/g, '$1<em>$2</em>')
    .replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`)
}
const indent = l => l.match(/^\s*/)[0].length
const isLi = l => /^\s*([-*]|\d+\.)\s/.test(l)
const strip = l => l.replace(/^\s*([-*]|\d+\.)\s/, '')
function fence(lines, i) {
  const code = [], pad = indent(lines[i])
  i++
  while (i < lines.length && !lines[i].trim().startsWith('```')) { const l = lines[i++]; code.push(l.slice(Math.min(pad, indent(l)))) }
  return { html: `<pre><code>${esc(code.join('\n'))}</code></pre>`, i: i + 1 }
}
function list(lines, i) {
  const base = indent(lines[i]), tag = /^\s*\d+\./.test(lines[i]) ? 'ol' : 'ul', items = []
  while (i < lines.length) {
    const l = lines[i]
    if (!l.trim()) {
      let j = i + 1
      while (j < lines.length && !lines[j].trim()) j++
      if (j < lines.length && (isLi(lines[j]) ? indent(lines[j]) >= base : indent(lines[j]) > base)) { i = j; continue }
      break
    }
    const ind = indent(l)
    if (isLi(l) && ind === base) { items.push({ t: strip(l), kids: '' }); i++; continue }
    if (ind > base && items.length) {
      if (l.trim().startsWith('```')) { const r = fence(lines, i); items.at(-1).kids += r.html; i = r.i } else if (isLi(l)) { const r = list(lines, i); items.at(-1).kids += r.html; i = r.i } else { items.at(-1).t += ' ' + l.trim(); i++ }
      continue
    }
    break
  }
  return { html: `<${tag}>${items.map(x => `<li>${inl(x.t)}${x.kids}</li>`).join('')}</${tag}>`, i }
}
function md(src) {
  const lines = src.split('\n'), out = []
  let i = 0
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())
  const brk = l => !l.trim() || /^(#{1,4}\s|\s*\||```|>|---+\s*$)/.test(l) || isLi(l)
  while (i < lines.length) {
    const l = lines[i]
    let m
    if (!l.trim()) { i++; continue }
    if (l.trim().startsWith('```')) {
      const r = fence(lines, i)
      out.push(r.html); i = r.i
    } else if ((m = l.match(/^(#{1,4})\s+(.*)/))) {
      out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); i++
    } else if (/^---+\s*$/.test(l)) {
      out.push('<hr>'); i++
    } else if (/^\s*\|/.test(l)) {
      const rows = []
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++])
      out.push('<table><thead><tr>' + cells(rows[0]).map(c => `<th>${inl(c)}</th>`).join('') + '</tr></thead><tbody>' + rows.slice(2).map(r => '<tr>' + cells(r).map(c => `<td>${inl(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>')
    } else if (l.startsWith('>')) {
      const q = []
      while (i < lines.length && lines[i].startsWith('>')) q.push(lines[i++].replace(/^>\s?/, ''))
      out.push(`<blockquote>${md(q.join('\n')).join('')}</blockquote>`)
    } else if (isLi(l)) {
      const r = list(lines, i)
      out.push(r.html); i = r.i
    } else {
      const p = []
      while (i < lines.length && !brk(lines[i])) p.push(lines[i++])
      out.push(`<p>${inl(p.join(' '))}</p>`)
    }
  }
  return out
}

const st = { project: '', avatar: '', thread: '', branch: 'main', model: '', effort: '', section: 'settled', label: null, age: 'now', settled: 146, others: [], children: {}, threads: {}, open: null, tabs: [], active: null, hover: null, draft: { text: '', attach: null } }

const FILL = [
  { proj: 'Gorpcore Studios', title: 'GORP - Chief of Staff', age: '5d', n: '1', av: '#3fae5a', ch: '' },
  { proj: 'I Have a Guy', title: 'GUY - Chief of Staff', age: '5d', n: '+2', av: '#e0b030', ch: '' },
  { proj: 'Collective Wisdom', title: 'WISE - Chief of Staff', age: '4d', n: '', av: '#8a8f98', ch: '' }
]
const fillRow = r => `<div class="trow"><div class="tl1"><span class="av" style="background:${r.av}"></span>${ic('pin', 12)}<span>${r.proj}</span><span class="tr">${r.age}</span></div><div class="tt">${r.title}</div><div class="tl3"><span>main</span><span class="ics">${r.n ? ic('git', 13) + r.n : ''}${ic('claude', 17, 'cl')}</span></div></div>`
const ownRow = (o, act) => {
  const right = o.working && o.label ? `${ic('loader', 15, 'spin')}${esc(o.label)}` : esc(o.age)
  return `<div class="trow${act ? ' act' : ''}"><div class="tl1"><span class="av ar">${esc(st.avatar)}</span><span>${esc(st.project)}</span><span class="tr">${right}</span></div><div class="tt">${esc(o.title)}</div><div class="tl3"><span>${esc(o.branch || 'main')}</span><span class="ics">${act ? `${ic('git', 13)}1<span class="glb">${ic('globe', 15)}</span>` : ''}${ic('claude', 17, 'cl')}</span></div></div>`
}
const chiefRow = () => ownRow({ title: st.thread, branch: st.branch, working: st.section === 'working', label: st.label, age: st.age }, true)
function renderSide() {
  const wk = st.section === 'working'
  const busy = st.others.filter(o => o.working)
  const work = [...(wk ? [chiefRow()] : []), ...busy.map(o => ownRow(o, false))]
  $('tlist').innerHTML = FILL.map(fillRow).join('') + (wk ? '' : chiefRow())
  $('swork').innerHTML = work.length ? `<div class="s-sec">Working<span>${work.length}${ic('chev-down', 14)}</span></div><div class="s-work">${work.join('')}</div>` : ''
  $('settled').textContent = st.settled + st.others.filter(o => !o.working).length
}
function renderHead() {
  const c = st.open && st.children[st.open]
  $('chead').innerHTML = `<span class="av ar">${esc(st.avatar)}</span><span>${esc(st.project)}</span><span>/</span><span class="cur">${esc(c ? c.title : st.thread)}</span><span class="sp"></span>${ic('doc', 20)}`
}
function renderModel() {
  const c = st.open && st.children[st.open]
  $('mp').innerHTML = `${ic('claude', 19, 'cl')}<span>${esc(c ? c.model : st.model)}</span><em>${esc(st.effort)}</em>`
}
const chip = label => `<div class="fchip">${ic('file', 16)}<span>${esc(label.replace(/\s+\S+\s?[KM]B$/, ''))}</span><small>${esc((label.match(/\S+\s?[KM]B$/) || [''])[0])}</small></div>`

const msgsEl = () => st.open ? $('tmsgs') : $('msgs')
const userHtml = (text, attach, sender) => `<div class="u">${sender ? `<div class="snd">${esc(sender)}</div>` : ''}${attach ? chip(attach) : ''}${text.split(/\n\s*\n/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('')}</div>`
function append(html, el = $('msgs')) { el.insertAdjacentHTML('beforeend', html); return el.lastElementChild }
const atEnd = m => m.scrollHeight - m.scrollTop - m.clientHeight < 60
const showPill = () => $('pill').classList.toggle('on', !st.open && !atEnd($('msgs')))
function renderThread(id) {
  $('tmsgs').innerHTML = (st.threads[id] || []).map(m => m.role === 'user' ? userHtml(m.md, null) : `<div class="a"><div class="body">${md(m.md).join('').replace(/<(p|h\d|ul|ol|table|pre|blockquote|hr)\b/g, '<$1 class="on"')}</div></div>`).join('')
}
function cardHtml(c) {
  const run = c.status === 'running'
  return `<div class="cav">${ic('claude', 26, 'cl')}<i class="dot ${run ? 'run' : 'done'}"></i></div><div class="cmid"><div class="ct">${esc(c.title)}${c.model ? `<span class="mtag">${esc(c.model)}</span>` : ''}</div><div class="cs">${esc(c.subtitle || '')}</div></div><div class="cr"><span>${run ? 'Running' : 'Finished'}</span><span>${esc(c.timeLabel || '')}</span></div>${ic('chev-right', 16)}`
}

const scr = () => $('view').querySelector('.ghp.on .gsc')
const activeTab = () => st.tabs.find(t => t.id === st.active)
function renderTabs() {
  $('tabs').innerHTML = st.tabs.map(t => `<div class="tab ${t.id === st.active ? 'on' : ''} ${t.id === st.hover ? 'hov' : ''}" data-tab-id="${esc(t.id)}">${ic(t.favicon === 'github' ? 'gh' : 'activity', 16, t.favicon === 'github' ? 'fl' : '')}<span>${esc(t.title)}</span>${t.kind === 'dash' ? '' : `<i class="x">${ic('x', 13)}</i>`}</div>`).join('')
}
function setUrl(url, select) {
  $('url').classList.toggle('sel', !!select)
  $('url').firstElementChild.textContent = url
}
function ghUrl() {
  const t = activeTab(), p = $('view').querySelector('.ghp.on')
  const files = p && p.querySelector('.pane.on')?.dataset.suffix
  return t ? t.url + (files || '') : ''
}

const treeHtml = (paths, sel) => {
  const root = { d: {}, f: [] }
  for (const p of paths) {
    const parts = p.split('/')
    let n = root
    for (const s of parts.slice(0, -1)) n = n.d[s] ??= { d: {}, f: [] }
    n.f.push({ name: parts.at(-1), path: p })
  }
  const render = (n, depth, prefix) => {
    let h = ''
    for (const [k, v] of Object.entries(n.d).sort(([a], [b]) => a.localeCompare(b))) {
      let name = k, c = v
      while (!c.f.length && Object.keys(c.d).length === 1) { const [k2, v2] = Object.entries(c.d)[0]; name += '/' + k2; c = v2 }
      const full = prefix + name, open = sel.startsWith(full + '/')
      h += `<div class="g-tr" style="padding-left:${depth * 10}px">${ic(open ? 'chev-down' : 'chev-right', 15)}<span class="fo">${ic('folder', 21, 'fl')}</span>${esc(name)}</div>`
      if (open) h += render(c, depth + 1, full + '/')
    }
    for (const f of n.f.sort((a, b) => a.name.localeCompare(b.name))) {
      h += `<div class="g-tr ${f.path === sel ? 'sel' : ''}" style="padding-left:${depth * 10 + 25}px">${ic('file', 19)}${esc(f.name)}</div>`
    }
    return h
  }
  return render(root, 0, '')
}
const kb = n => { const v = n / 1024; return (v >= 10 && Math.abs(v - Math.round(v)) < .05 ? String(Math.round(v)) : v.toFixed(1)) + ' KB' }
const avatar = login => `<span class="g-ca">${esc(login[0].toUpperCase())}</span>`
const day = iso => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'America/New_York' })

const S = {
  md,
  intro(on) { $('intro').style.display = on ? 'flex' : 'none' },
  caption(t) { $('cap').textContent = t },
  timelapse(text) { const l = $('lapse'); l.textContent = text || ''; l.style.display = text ? 'block' : 'none' },
  cursor(x, y) { $('cur').style.transform = `translate(${x}px,${y}px)`; S.cx = x; S.cy = y },
  ripple(p) { const r = $('rip'); r.style.transform = `translate(${S.cx}px,${S.cy}px) scale(${0.4 + p * 1.2})`; r.style.opacity = String(p <= 0 ? 0 : 1 - p) },

  setup(o) {
    Object.assign(st, { project: o.project, avatar: o.projectAvatar, thread: o.thread, branch: o.branch || 'main', settled: o.settled ?? st.settled })
    S.setModel(o.model, o.effort)
    renderSide(); renderHead()
  },
  setModel(model, effort) { st.model = model; st.effort = effort; renderModel() },
  setSidebarStatus(o) { Object.assign(st, { section: o.section, label: o.label || null, age: o.age || st.age }); renderSide() },
  setSidebarThreads(rows) { st.others = rows; renderSide() },

  composer(text, attach) {
    st.draft = { text, attach }
    $('ctext').innerHTML = (attach ? chip(attach) : '') + (text ? `${esc(text)}<span class="caret"></span>` : '<span class="ph">Ask anything. @ files, $ skills, / commands</span>')
    $('send').classList.toggle('on', !!text)
  },
  addUser(text, attach, sender) { append(userHtml(text, attach, sender)); S.composer('', null); S.bottom() },
  working(on) {
    let w = $('wrk')
    if (on && !w) { append('<div class="working" id="wrk"><i></i>Working</div>'); S.bottom() }
    if (!on && w) w.remove()
    S.setSidebarStatus(on ? { section: 'working', label: 'Working', age: 'now' } : { section: 'settled', label: null, age: 'now' })
  },
  addAssistant(src) {
    $('wrk')?.remove()
    const d = append('<div class="a"><div class="body"></div></div>')
    const b = d.firstElementChild
    for (const h of md(src)) { const t = document.createElement('div'); t.innerHTML = h; b.appendChild(t.firstChild) }
    S.cur = b
    return b.children.length
  },
  reveal(k) { [...S.cur.children].forEach((c, i) => c.classList.toggle('on', i < k)); S.bottom() },
  bottom() { const m = msgsEl(); m.scrollTop = m.scrollHeight; showPill() },
  chatScroll(y) { $('msgs').scrollTop = y; showPill() },
  chatMetrics() { const m = $('msgs'); return { top: m.scrollTop, height: m.scrollHeight, view: m.clientHeight, messages: m.children.length } },
  addWorked(label) { append(`<div class="worked">${esc(label)}${ic('chev-right', 15)}</div>`); S.bottom() },

  addChildCard(c) {
    st.children[c.id] = { ...c }
    const d = append(`<div class="card" data-child-id="${esc(c.id)}">${cardHtml(c)}</div>`)
    S.bottom()
    return d
  },
  updateChildCard(id, patch) {
    const c = Object.assign(st.children[id], patch)
    document.querySelector(`#msgs .card[data-child-id="${CSS.escape(id)}"]`).innerHTML = cardHtml(c)
    if (st.open === id) { renderHead(); renderModel() }
  },
  setWaitBar(o) {
    const w = $('wait')
    w.classList.toggle('multi', !!(o && o.label))
    w.innerHTML = !o ? '' : o.label
      ? `<span class="spin">${ic('loader', 17)}</span><span class="t">${esc(o.label)}</span><span class="d">${esc(o.detail)}</span><span class="i">${ic('info', 17)}</span><b>Details</b><b>Stop</b>`
      : `<span class="spin">${ic('loader', 17)}</span><span class="t">Waiting · ${esc(o.title)}</span><span class="el">${esc(o.elapsed)}</span><b>Details</b><span>Open</span><b>Stop</b>`
  },
  setThreadMessages(id, msgs) { st.threads[id] = msgs; if (st.open === id) renderThread(id) },
  openThread(id) {
    st.open = id
    $('msgs').hidden = true; $('tmsgs').hidden = false; $('wait').style.visibility = 'hidden'
    renderThread(id); renderHead(); renderModel(); S.bottom()
  },
  closeThread() {
    st.open = null
    $('msgs').hidden = false; $('tmsgs').hidden = true; $('wait').style.visibility = ''
    renderHead(); renderModel(); showPill()
  },

  browserTabs(list) {
    st.tabs = list
    const view = $('view')
    view.querySelectorAll('.ghp').forEach(p => { if (!list.some(t => t.kind === 'gh' && 'gp-' + t.id === p.id)) p.remove() })
    for (const t of list) if (t.kind === 'gh' && !$('gp-' + t.id)) view.insertAdjacentHTML('beforeend', `<div class="ghp" id="gp-${esc(t.id)}"></div>`)
    if (!list.some(t => t.id === st.active)) st.active = list[0]?.id
    renderTabs(); S.browserSelect(st.active)
  },
  browserSelect(id) {
    st.active = id
    const t = activeTab()
    $('dash').style.visibility = t && t.kind === 'dash' ? 'visible' : 'hidden'
    $('view').querySelectorAll('.ghp').forEach(p => p.classList.toggle('on', !!t && p.id === 'gp-' + t.id))
    renderTabs(); setUrl(ghUrl() || (t ? t.url : ''))
  },
  browserUrl(url, select) { setUrl(url, select) },
  tabHover(id) { st.hover = id; renderTabs() },
  browserExpand(on) { $('app').classList.toggle('exp', on); $('wcx').innerHTML = ic(on ? 'shrink' : 'expand', 21) },
  ghPage(tabId, html) { $('gp-' + tabId).innerHTML = html; if (st.active === tabId) setUrl(ghUrl()) },
  ghScroll(y) { scr().scrollTop = y },
  ghScrollTo(text) {
    const s = scr(), h = [...s.querySelectorAll('h1,h2,h3,h4')].find(e => e.textContent.includes(text))
    return h ? Math.max(0, Math.round(h.getBoundingClientRect().top - s.getBoundingClientRect().top + s.scrollTop - 24)) : 0
  },
  ghScrollHeight() { return scr().scrollHeight },
  ghTabSwitch(n) {
    const p = $('view').querySelector('.ghp.on')
    p.querySelectorAll('.pane').forEach((e, i) => e.classList.toggle('on', i === n))
    p.querySelectorAll('.g-tabs [data-n]').forEach((e, i) => e.classList.toggle('on', i === n))
    scr().scrollTop = 0
    setUrl(ghUrl())
  },

  ghBlobPage({ path, sha, md: src, lines, size, tree }) {
    const parts = path.split('/'), loc = src.split('\n').filter(l => l.trim()).length
    return `<div class="g-blob"><aside class="g-files">
      <div class="g-fh"><span class="g-ib">${ic('panel-left', 19)}</span>Files</div>
      <div class="g-pick"><span class="nav">${ic('chev-left', 16)}</span><span class="br">${ic('git', 18)}${esc(sha)}${ic('chev-down', 14, 'fl')}</span><span class="sb">${ic('search', 18)}</span></div>
      <div class="g-goto">${ic('search', 19)}Go to file<kbd>T</kbd></div>
      ${treeHtml(tree, path)}</aside>
    <main class="g-bmain"><div class="g-bhead">
      <div class="g-crumb"><a>album-ranker</a>${parts.slice(0, -1).map(p => `<span>/</span><a>${esc(p)}</a>`).join('')}<span>/</span><b>${esc(parts.at(-1))}</b>${ic('copy', 19)}<span class="top">${ic('arrow-up', 15)}Top</span></div>
      <div class="g-bar"><div class="g-seg"><div class="on">Preview</div><div>Code</div><div>Blame</div></div><span class="g-meta">${lines} lines (${loc} loc) · ${kb(size)}</span>
        <span class="rt"><span class="raw">Raw${ic('copy', 19)}${ic('download', 19)}</span>${ic('pencil', 19)}${ic('chev-down', 15)}${ic('list', 21)}</span></div></div>
      <div class="gsc"><article class="g-md">${md(src).join('')}</article></div></main></div>`
  },
  ghPrPage({ pr, state, bodyMd, comments, commits, files, checks, mergeable }) {
    const added = files.reduce((n, f) => n + f.additions, 0), removed = files.reduce((n, f) => n + f.deletions, 0)
    const author = pr.author || comments[0]?.author?.login || 'dbeallor'
    const merged = state === 'MERGED', closed = state === 'CLOSED'
    const cm = comments.map(c => {
      const v = /Verdict:\s*(PASS|[A-Z ]+)/.exec(c.body)?.[1]
      return `<div class="g-cm"><div class="g-ch">${avatar(c.author.login)}<b>${esc(c.author.login)}</b> commented on ${day(c.createdAt)}${v ? `<span class="v ${v === 'PASS' ? 'pass' : 'fail'}" style="margin-left:auto">${esc(v)}</span>` : ''}</div><div class="g-cb"><div class="g-md">${md(c.body.replace(/^##\s*/, '### ')).join('')}</div></div></div>`
    }).join('')
    const checkRows = checks.length ? checks.map(k => `<div class="g-mr"><span class="g-mi ${k.state === 'success' ? '' : 'gr'}">${ic('check', 17)}</span><div><div class="t">${esc(k.name)}</div></div></div>`).join('') : `<div class="g-mr"><span class="g-mi gr">${ic('check', 17)}</span><div><div class="t">No checks configured</div><div class="s">This repository has no CI workflows.</div></div></div>`
    const box = merged
      ? `<div class="g-merge merged"><div class="g-mr"><span class="g-mi pu">${ic('pr', 17)}</span><div><div class="t">Pull request successfully merged and closed</div><div class="s">You're all set — the <code>${esc(pr.headRefName)}</code> branch can be safely deleted.</div></div></div></div>`
      : `<div class="g-merge">${checkRows}
          <div class="g-mr"><span class="g-mi ${mergeable ? '' : 'gr'}">${ic(mergeable ? 'check' : 'x', 17)}</span><div><div class="t">${mergeable ? 'This branch has no conflicts with the base branch' : 'This branch has conflicts that must be resolved'}</div><div class="s">${mergeable ? 'Merging can be performed automatically.' : ''}</div></div></div>
          <div class="g-mr"><span class="g-mbtn"><span>${ic('pr', 16)}Merge pull request</span><span>${ic('chev-down', 14)}</span></span></div></div>`
    const line = l => `<div class="g-dl ${l.k === '+' ? 'ad' : l.k === '-' ? 'dl' : ''}"><i>${l.o ?? ''}</i><i>${l.n ?? ''}</i><span>${l.k === ' ' ? '' : l.k}</span><span>${esc(l.t)}</span></div>`
    const fileHtml = f => {
      const tag = f.status === 'added' ? 'new file' : f.status === 'deleted' ? 'deleted' : ''
      const head = `<div class="g-dh ${f.open ? '' : 'col'}">${ic(f.open ? 'chev-down' : 'chev-right', 15)}<span>${esc(f.status === 'renamed' ? `${f.oldPath} → ${f.path}` : f.path)}</span>${tag ? `<span class="tg">${tag}</span>` : ''}<span class="st"><span class="add">+${f.additions}</span><span class="del">−${f.deletions}</span></span></div>`
      const body = f.open
        ? f.hunks.map(h => `<div class="g-dl h"><i></i><i></i><span></span><span>${esc(h.header)}</span></div>${h.lines.map(line).join('')}`).join('') + (f.hidden ? `<div class="g-dl hid"><i></i><i></i><span></span><span>${f.hidden} more lines not shown</span></div>` : '')
        : f.note ? `<div class="g-note">${esc(f.note)}</div>` : ''
      return `<div class="g-diff">${head}${body}</div>`
    }
    return `<div class="gsc"><div class="g-pad">
      <h1 class="g-title">${esc(pr.title)} <span>#${pr.number}</span></h1>
      <div class="g-st"><span class="badge ${merged ? 'merged' : closed ? 'closed' : ''}">${ic('pr', 16)}${merged ? 'Merged' : closed ? 'Closed' : 'Open'}</span><span>${esc(author)} ${merged ? 'merged' : 'wants to merge'} ${commits} commit${commits === 1 ? '' : 's'} into <code>main</code> from <code>${esc(pr.headRefName)}</code></span></div>
      <div class="g-tabs"><div class="on" data-n="0">Conversation<em>${comments.length + 1}</em></div><div>Commits<em>${commits}</em></div><div>Checks<em>${checks.length}</em></div><div data-n="1">Files changed<em>${files.length}</em></div></div>
      <div class="pane on" data-suffix="">
        <div class="g-cm"><div class="g-ch">${avatar(author)}<b>${esc(author)}</b> opened this pull request<span class="own">Author</span></div><div class="g-cb"><div class="g-md">${md(bodyMd).join('')}</div></div></div>
        ${cm}
        ${box}
      </div>
      <div class="pane" data-suffix="/files">
        <div class="g-sum">Showing ${files.length} changed file${files.length === 1 ? '' : 's'} with <b class="add">${added} additions</b> and <b class="del">${removed} deletions</b>.</div>
        <div class="g-fl">${files.map(f => `<div>${ic('file', 15)}<span>${esc(f.path)}</span><span class="st"><span class="add">+${f.additions}</span><span class="del">−${f.deletions}</span></span></div>`).join('')}</div>
        ${files.map(fileHtml).join('')}
      </div></div></div>`
  },
  ghIssuePage({ number, title, state, author, bodyMd, labels, comments }) {
    const open = state.toUpperCase() === 'OPEN'
    const cm = comments.map(c => `<div class="g-cm"><div class="g-ch">${avatar(c.author.login)}<b>${esc(c.author.login)}</b> commented on ${day(c.createdAt)}</div><div class="g-cb"><div class="g-md">${md(c.body).join('')}</div></div></div>`).join('')
    return `<div class="gsc"><div class="g-pad">
      <h1 class="g-title">${esc(title)} <span>#${number}</span></h1>
      <div class="g-st"><span class="badge ${open ? '' : 'closed'}">${ic('issue', 16)}${open ? 'Open' : 'Closed'}</span><span>${esc(author)} opened this issue</span>${labels.map(l => `<span class="g-lbl" style="background:#${l.color || '3a474c'}">${esc(l.name)}</span>`).join('')}</div>
      <div class="g-cm"><div class="g-ch">${avatar(author)}<b>${esc(author)}</b> opened<span class="own">Owner</span></div><div class="g-cb"><div class="g-md">${md(bodyMd).join('')}</div></div></div>
      ${cm}
    </div></div>`
  }
}
window.S = S
S.setup({ project: 'Project', projectAvatar: 'P', thread: 'Chief of Staff', branch: 'main', model: 'Sonnet 5.5', effort: 'Medium' })
S.browserExpand(false); S.composer('', null); S.cursor(1500, 900); S.ripple(0)
</script></body></html>
